; M5Stack モノレポ — 単一 platformio.ini で全機種・全プロジェクトを管理する。
;
; 構成の考え方:
;   [device:*]  … 機種ごとのボード定義（board / flash / partitions / DEVICE_NAME）
;   [project:*] … プロジェクトごとのソース選択（build_src_filter）と追加 lib_deps
;   [env:*]     … 上の 2 つを掛け合わせたビルド対象
;
; 命名規則: env 名もソースのパスも <device>/<project> の順で揃える。
;   projects/cardputer/totp/  -> [project:cardputer-totp] -> [env:cardputer-totp]
;   projects/_common/hello/   -> [project:hello]          -> [env:<device>-hello] を機種分
;
; 使い方:
;   pio run                        -> default_envs のみビルド
;   pio run -e cardputer-hello     -> 指定 env をビルド
;   pio run -e cardputer-hello -t upload -t monitor
;   pio run -t clean

[platformio]
src_dir = projects
default_envs = cardputer-hello

; ---------------------------------------------------------------- 共通設定
[env]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 1500000
build_flags =
	-DCORE_DEBUG_LEVEL=1
lib_deps =
	m5stack/M5Unified@^0.2.7

; ---------------------------------------------------------------- 機種定義
; Cardputer / Capsule は専用の board ID が espressif32 に無い。どちらも中身は
; StampS3 なので m5stack-stamps3 を使う（M5Stack 公式の PlatformIO 案内と同じ）。

[device:cardputer]
board = m5stack-stamps3
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = ${env.build_flags} -D DEVICE_NAME=\"M5Cardputer\"

[device:capsule]
board = m5stack-stamps3
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = ${env.build_flags} -D DEVICE_NAME=\"M5Capsule\"

; StickC Plus2 も専用 ID が無い。m5stick-c は 4MB 想定なので 8MB に上書きする。
; app サイズの上限は partitions から自動算出されるので maximum_size は触らないこと。
[device:stickc-plus2]
board = m5stick-c
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags = ${env.build_flags} -D DEVICE_NAME=\"M5StickC-Plus2\"

; Atom Lite と Matrix はボードとしては同一（差は本体の LED だけ）。
[device:atom-lite]
board = m5stack-atom
build_flags = ${env.build_flags} -D DEVICE_NAME=\"M5Atom-Lite\"

[device:atom-matrix]
board = m5stack-atom
build_flags = ${env.build_flags} -D DEVICE_NAME=\"M5Atom-Matrix\"

[device:core]
board = m5stack-core-esp32
build_flags = ${env.build_flags} -D DEVICE_NAME=\"M5Stack-Core\"

[device:core2]
board = m5stack-core2
build_flags = ${env.build_flags} -D DEVICE_NAME=\"M5Stack-Core2\"

[device:cores3]
board = m5stack-cores3
build_flags = ${env.build_flags} -D DEVICE_NAME=\"M5Stack-CoreS3\"

; ------------------------------------------------------------ プロジェクト定義
; 全機種共通（M5Unified が機種差を吸収するもの）は projects/_common/ に置く。
[project:hello]
build_src_filter = -<*> +<_common/hello/>

; 機種固有プロジェクトはここに足していく。テンプレート:
;
;   [project:cardputer-totp]
;   build_src_filter = -<*> +<cardputer/totp/>
;   lib_deps = ${env.lib_deps}
;   	m5stack/M5Cardputer@^1.0.0
;
;   [env:cardputer-totp]
;   extends = device:cardputer, project:cardputer-totp

; ------------------------------------------------------------------- ビルド対象
[env:cardputer-hello]
extends = device:cardputer, project:hello

[env:capsule-hello]
extends = device:capsule, project:hello

[env:stickc-plus2-hello]
extends = device:stickc-plus2, project:hello

[env:atom-lite-hello]
extends = device:atom-lite, project:hello

[env:atom-matrix-hello]
extends = device:atom-matrix, project:hello

[env:core-hello]
extends = device:core, project:hello

[env:core2-hello]
extends = device:core2, project:hello

[env:cores3-hello]
extends = device:cores3, project:hello
